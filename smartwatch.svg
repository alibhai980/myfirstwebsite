<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a86b"/>
      <stop offset="100%" stop-color="#00d084"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- Straps -->
  <path d="M 160 40 L 240 40 L 235 120 L 165 120 Z" fill="url(#strapGrad)" filter="url(#shadow)"/>
  <path d="M 165 280 L 235 280 L 240 360 L 160 360 Z" fill="url(#strapGrad)" filter="url(#shadow)"/>

  <!-- Watch Case -->
  <rect x="135" y="105" width="130" height="190" rx="36" fill="url(#caseGrad)" filter="url(#shadow)"/>
  <rect x="140" y="110" width="120" height="180" rx="32" fill="#0b1120" stroke="#334155" stroke-width="2"/>

  <!-- Crown Button -->
  <rect x="265" y="145" width="8" height="26" rx="4" fill="#64748b"/>
  <rect x="265" y="195" width="6" height="35" rx="3" fill="#475569"/>

  <!-- OLED Screen -->
  <rect x="148" y="118" width="104" height="164" rx="26" fill="url(#screenGrad)"/>

  <!-- Screen Content -->
  <circle cx="200" cy="180" r="44" fill="none" stroke="#1e293b" stroke-width="8"/>
  <circle cx="200" cy="180" r="44" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-dasharray="276" stroke-dashoffset="75" stroke-linecap="round"/>
  <circle cx="200" cy="180" r="32" fill="none" stroke="#ff6b00" stroke-width="6" stroke-dasharray="200" stroke-dashoffset="60" stroke-linecap="round"/>

  <text x="200" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">10:42</text>
  <text x="200" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#00d084" text-anchor="middle">7,420 STEPS</text>
  <text x="200" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" text-anchor="middle">♥ 76 BPM</text>

  <!-- Screen Gloss Reflection -->
  <path d="M 152 125 C 190 125 240 145 248 185 C 248 150 215 125 170 125 Z" fill="#ffffff" opacity="0.08"/>
</svg>
