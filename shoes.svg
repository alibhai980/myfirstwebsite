<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="shoeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="soleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#ff8f3d"/>
    </linearGradient>
    <filter id="shoeShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bgGrad2)" rx="16"/>

  <!-- Ground reflection/shadow -->
  <ellipse cx="205" cy="290" rx="145" ry="16" fill="#cbd5e1" opacity="0.6"/>

  <!-- Shoe Body -->
  <g filter="url(#shoeShadow)">
    <!-- Sole -->
    <path d="M 60 255 C 60 255 105 275 220 275 C 310 275 355 250 355 240 C 355 235 340 230 310 235 C 250 245 160 240 100 235 C 75 233 60 245 60 255 Z" fill="url(#soleGrad)"/>
    <path d="M 75 260 C 130 275 220 275 320 260 C 335 258 350 252 350 248 C 345 254 320 268 220 270 C 120 270 75 258 75 260 Z" fill="#ff6b00"/>

    <!-- Upper Body -->
    <path d="M 75 242 C 95 210 130 195 165 190 C 200 185 245 155 270 145 C 285 140 300 160 290 185 C 280 205 325 215 345 235 C 320 238 270 240 220 240 C 160 240 105 242 75 242 Z" fill="url(#shoeGrad)"/>

    <!-- Collar / Ankle Opening -->
    <path d="M 245 155 C 260 145 285 148 285 165 C 285 180 265 195 250 195 C 240 195 235 180 245 155 Z" fill="#0f172a"/>

    <!-- Accent Swoosh / Waves -->
    <path d="M 120 235 C 160 220 210 205 265 175 C 250 195 205 225 150 235 Z" fill="url(#orangeGlow)"/>
    <path d="M 160 235 C 190 225 240 210 280 190 C 265 205 230 225 185 235 Z" fill="#ffffff" opacity="0.8"/>

    <!-- Laces -->
    <path d="M 215 190 L 235 175" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M 205 200 L 225 185" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M 195 210 L 215 195" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M 185 220 L 205 205" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <!-- Air Mesh Dots -->
    <circle cx="120" cy="225" r="2" fill="#38bdf8" opacity="0.6"/>
    <circle cx="130" cy="222" r="2" fill="#38bdf8" opacity="0.6"/>
    <circle cx="140" cy="220" r="2" fill="#38bdf8" opacity="0.6"/>
    <circle cx="125" cy="230" r="2" fill="#38bdf8" opacity="0.6"/>
    <circle cx="135" cy="228" r="2" fill="#38bdf8" opacity="0.6"/>
  </g>
</svg>
