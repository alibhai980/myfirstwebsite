<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="bagBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="bagShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bagBg)" rx="16"/>

  <!-- Shadow below bag -->
  <ellipse cx="200" cy="340" rx="90" ry="14" fill="#cbd5e1" opacity="0.6"/>

  <g filter="url(#bagShadow)">
    <!-- Top Handle -->
    <path d="M 170 100 C 170 70 230 70 230 100" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>

    <!-- Main Body -->
    <path d="M 130 140 C 130 90 270 90 270 140 L 285 305 C 285 325 265 335 240 335 L 160 335 C 135 335 115 325 115 305 Z" fill="url(#bagBody)"/>

    <!-- Front Pocket -->
    <rect x="135" y="200" width="130" height="110" rx="16" fill="url(#pocketGrad)"/>
    
    <!-- Zipper -->
    <path d="M 145 200 L 255 200" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6,3"/>
    <circle cx="200" cy="200" r="4" fill="#ff6b00"/>

    <!-- Top Zipper Arc -->
    <path d="M 145 130 C 155 110 245 110 255 130" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="6,3"/>

    <!-- Buckles and Straps -->
    <rect x="155" y="235" width="20" height="50" rx="4" fill="#0f172a"/>
    <rect x="225" y="235" width="20" height="50" rx="4" fill="#0f172a"/>
    <rect x="153" y="255" width="24" height="8" rx="2" fill="#ff6b00"/>
    <rect x="223" y="255" width="24" height="8" rx="2" fill="#ff6b00"/>

    <!-- Modern Badge -->
    <rect x="180" y="150" width="40" height="18" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="200" y="163" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#00d084" text-anchor="middle">TRAVEL</text>
  </g>
</svg>
